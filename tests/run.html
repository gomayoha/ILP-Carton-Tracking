<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carton Tracking · tests</title>
<script src="../vendor/qrcode-generator.js"></script>
<style>
  body { font: 14px/1.5 Montserrat, Arial, sans-serif; margin: 24px; }
  .pass { color: #2e7d32; } .fail { color: #b3261e; font-weight: 600; }
  h1 { font-size: 20px; } pre { background: #f5f5f3; padding: 8px; }
</style>
</head>
<body>
<h1>Business-rule tests</h1>
<p>Open this page from the local server (e.g. http://127.0.0.1:8765/tests/run.html). Every line should be green.</p>
<div id="out"></div>
<script type="module">
  import { split, notation, packingRows, totals, movementBlocks, recordCartons, fmtWO, validate, handNotation, perCartonNotation, receiptState, hasReceipt, scanGroups, packingListLines, cartonPallet, excelDate, pickFromLines, pickProgress, currentStock, stockByLocation, rackOf, locLabel, cartonLedger, stockDataRows, STOCK_DATA_HEADER, textToLines, linesToTable, docNum, parseDims, docPO, pickSuggest, docSupplier, docNumber, qrInRows, STOCK_IN_HEADER } from '../src/model.js';
  import { incrementDocNo, norm } from '../src/util.js';
  import { parseScan, cartonPayload, locationPayload } from '../src/qr.js';
  import { DEFAULT_SETTINGS } from '../src/store.js';
  import { sampleRecords } from '../src/sample.js';

  const out = document.getElementById('out');
  let failed = 0, passed = 0;
  const eq = (name, got, want) => {
    const ok = JSON.stringify(got) === JSON.stringify(want);
    ok ? passed++ : failed++;
    out.insertAdjacentHTML('beforeend', `<div class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'} ${name}${ok ? '' : `<pre>got:  ${JSON.stringify(got)}\nwant: ${JSON.stringify(want)}</pre>`}</div>`);
  };

  const [slip, ship] = sampleRecords();

  // Paper notation on slip 0001955: 34T(100) + 1T(40) = 3,440 pcs
  eq('split 3440 @ 100', split(3440, 100), { full: 34, partial: 40, count: 35 });
  eq('notation 3440 @ 100', notation(3440, 100), '34T(100) + 1T(40)');
  eq('exact cartons have no partial', split(900, 300), { full: 3, partial: 0, count: 3 });
  eq('no pcs/carton = no cartons', split(500, ''), { full: 0, partial: 0, count: 0 });
  eq('slip 0001955 creates 35 labels', recordCartons(slip).length, 35);
  eq('slip 0001955 total qty', totals(slip).qty, 19790);
  eq('label 35/35 is the partial carton of 40', (({ n, of, qty, isPartial }) => ({ n, of, qty, isPartial }))(recordCartons(slip)[34]), { n: 35, of: 35, qty: 40, isPartial: true });

  // Packing list IDE0004000 — must match the paper exactly
  const rows = packingRows(ship).map((r) => [r.cartonNo, r.qty, r.uoms, r.perUom, r.nw, r.gw, r.tnw, r.tgw]);
  eq('packing list rows', rows, [
    ['1-9', 8100, 9, 900, 8.95, 9.45, 80.55, 85.05],
    ['10', 863, 1, 863, 2.6, 3.1, 2.6, 3.1],
    ['11-14', 3600, 4, 900, 8.95, 9.45, 35.8, 37.8],
    ['15', 446, 1, 446, 2.6, 3.1, 2.6, 3.1],
  ]);
  const t = totals(ship);
  eq('packing list totals', { qty: t.qty, cartons: t.cartons, nw: t.nw, gw: t.gw, cbm: Math.round(t.cbm * 100) / 100 }, { qty: 13009, cartons: 15, nw: 121.55, gw: 129.05, cbm: 0.35 });
  eq('shipping labels numbered 1…15 across lines', recordCartons(ship).map((c) => `${c.n}/${c.of}`).slice(8, 11), ['9/15', '10/15', '11/15']);

  // Excel rows match the stock workbooks
  const hb = movementBlocks(slip, DEFAULT_SETTINGS);
  eq('handoff → PRINT sheet row', hb[0].rows[0], ['ILPLOV02150003', '9010780009', '', 3440, 'piece', 'In', '2026-09-07', 'Nhận thành phẩm', 'WO10131', '']);
  eq('handoff PNK goes to column J', movementBlocks({ ...slip, noteNo: 'PNK0003012' }, DEFAULT_SETTINGS)[0].rows[0][9], 'PNK0003012');
  const sb = movementBlocks(ship, DEFAULT_SETTINGS);
  eq('shipment → In-out detail rows (full + partial)', sb[0].rows.slice(0, 2), [
    ['IDE0004000', '9090070468', 'ILPDIM13033191', -8100, 9, 'out', '2026-09-11', 'Sample Customer Co., Ltd.', ''],
    ['IDE0004000', '9090070468', 'ILPDIM13033191', -863, 1, 'out', '2026-09-11', 'Sample Customer Co., Ltd.', ''],
  ]);
  const transfer = { id: 'TESTTRF0', type: 'transfer', docNo: 'TF000001', date: '2026-09-08', fromWh: 'PRINT', toWh: 'PACK', extRef: 'POVN-2600101', outNoteNo: 'pxk0006343', noteNo: 'pnk0002874', lines: [],
    scans: [...Array(33)].map((_, i) => ({ cid: `S1955A0B-1-${i + 1}`, code: 'ILPLOV02150003', ref: '9010780009', desc: 'Printed box', qty: 100, unit: 'piece' })).concat([{ cid: 'S1955A0B-1-35', code: 'ILPLOV02150003', ref: '9010780009', desc: 'Printed box', qty: 34, unit: 'piece' }]) };
  const tb = movementBlocks(transfer, DEFAULT_SETTINGS);
  eq('transfer → PRINT out rows', tb[0].rows.map((r) => [r[3], r[5], r[7], r[9]]), [[-3300, 'out', 'transfer to pack', 'pxk0006343'], [-34, 'out', 'transfer to pack', 'pxk0006343']]);
  eq('transfer → Trading in rows', tb[1].rows.map((r) => [r[0], r[3], r[4], r[5], r[7], r[8]]), [['POVN-2600101', 3300, 33, 'in', 'transfer from print', 'pnk0002874'], ['POVN-2600101', 34, 1, 'in', 'transfer from print', 'pnk0002874']]);

  // Numbering
  eq('next slip number', incrementDocNo('0001955'), '0001956');
  eq('next invoice number', incrementDocNo('IDE0004000'), 'IDE0004001');
  eq('next POVN number', incrementDocNo('POVN-2600087'), 'POVN-2600088');
  eq('rollover keeps width', incrementDocNo('0009999'), '0010000');

  // Work order formats seen in the stock report
  eq('WO formats', ['10131', 'wo10141', 'WO 10134', 'WO10131'].map(fmtWO), ['WO10131', 'WO10141', 'WO10134', 'WO10131']);
  eq('plan WO prefix kept', ['IN0010211', 'in 0010211'].map(fmtWO), ['IN0010211', 'IN0010211']);

  // QR payloads round-trip through the scanner parser
  const c = recordCartons(slip)[0];
  eq('link payload parses', parseScan(cartonPayload(c, 'link')).cartonId, 'S1955A0B-1-1');
  eq('id payload parses', parseScan(cartonPayload(c, 'id')).cartonId, 'S1955A0B-1-1');
  eq('scanner-gun data payload parses', parseScan(cartonPayload(c, 'data')).cartonId, 'S1955A0B-1-1');
  eq('lower-case typing parses', parseScan('s1955a0b-1-35').cartonId, 'S1955A0B-1-35');
  eq('foreign QR is rejected', parseScan('https://example.com/promo'), null);

  // Search normalisation (Vietnamese accents)
  eq('accent-free search', norm('Nhận thành phẩm  Đơn'), 'nhan thanh pham don');

  // Hand-written notation on the carton labels (photo of the IDEA-L-PRINT label, 6 Oct 2026)
  eq('per carton 4×25=100', perCartonNotation(100, 25), '4×25=100');
  eq('per carton without bundle', perCartonNotation(100, ''), '100');
  eq('bundle that does not divide is ignored', perCartonNotation(100, 30), '100');
  eq('total 20T=2000, odd 1T=72, grand 2072', handNotation(2072, 100), { total: '20T=2000', odd: '1T=72', grand: '2072' });
  eq('label carries per-carton notation + line totals', (({ perCarton, lineNotation }) => ({ perCarton, lineNotation }))(recordCartons({ ...slip, lines: [{ ...slip.lines[0], qty: 2072, ppc: 100, bundle: 25 }] })[0]),
    { perCarton: '4×25=100', lineNotation: { total: '20T=2000', odd: '1T=72', grand: '2072' } });

  // Shipping production cartons as they are (scanned, no new labels)
  const scanShip = { ...ship, lines: [], scanPo: { ILPLOV02150003: 'PONL-2600010' },
    scans: [...Array(3)].map((_, i) => ({ cid: `S1955A0B-1-${i + 1}`, code: 'ILPLOV02150003', ref: '9010780009', desc: 'Printed box', qty: 100, unit: 'piece', nw: 4, gw: 4.2, l: 35, w: 25, h: 27 }))
      .concat([{ cid: 'S1955A0B-1-35', code: 'ILPLOV02150003', ref: '9010780009', desc: 'Printed box', qty: 40, unit: 'piece', l: 35, w: 25, h: 27 }]) };
  eq('scanned shipment creates no new labels', recordCartons(scanShip).length, 0);
  eq('scanned shipment totals', (({ qty, cartons, gw }) => ({ qty, cartons, gw }))(totals(scanShip)), { qty: 340, cartons: 4, gw: 12.6 });
  eq('scanned shipment packing rows', packingRows(scanShip).map((r) => [r.po, r.cartonNo, r.qty, r.perUom, r.gw]), [['PONL-2600010', '1-3', 300, 100, 4.2], ['PONL-2600010', '4', 40, 40, '']]);
  eq('scanned shipment stock-out rows count each carton once', movementBlocks(scanShip, DEFAULT_SETTINGS)[0].rows.map((r) => [r[3], r[4]]), [[-300, 3], [-40, 1]]);
  const mixed = { ...ship, scans: scanShip.scans };
  eq('repacked cartons are numbered before scanned ones', recordCartons(mixed)[0].of, 15 + 4);

  // Receipt confirmation by the warehouse
  eq('slip waits for the warehouse', receiptState(slip).status, 'pending');
  const ids = recordCartons(slip).map((c) => c.id);
  eq('receipt with 2 cartons missing', (({ status, missing, counted }) => ({ status, missing, counted }))(receiptState({ ...slip, receipt: { by: 'Kho', at: 1, ids: ids.slice(2) } })), { status: 'received', missing: 2, counted: 33 });
  eq('shipments need no receipt', hasReceipt(ship), false);

  // Validation
  eq('handoff does not need received by (warehouse confirms it)', validate({ ...slip, receivedBy: '' }), []);
  eq('valid slip passes', validate(slip), []);

  // Supplier receipt from a supplier packing list (same columns as the group's packing lists; made-up codes)
  const plHead = ['Customer PO', 'Customer Style', 'Internal Code', 'Description', 'Order Qty', 'Number\nof UOM', 'Qty\n/UOM', 'Net weight\n(1 carton)', 'Gross\nweight\n(1 carton)', 'L\n(1\ncarton)', 'W\n(1\ncarton)', 'H\n(1\ncarton)', 'Total\nN.W(KG)', 'boxes\n/Pallet', 'Pallet', 'Pallet\nNo', 'Pallet Net\nWeight\n(1 pallet)', 'L\n(1\npallet)\n(cm)'];
  const plRows = [['IDEA L PACK B.V'], [], plHead,
    ['PO-TEST-1', 'STYLE-A', 'ILPTST00000001', 'Printed box', 150000, 600, 250, 4.5, 5, 40, 24, 21, 2700, 50, 12, '1-12', 225, 120],
    ['PO-TEST-1', 'STYLE-B', 'ILPTST00000002', 'Paper card', 500, 1, 500, 4.5, 5, 41, 24, 22, 4.5, '', '', '', '', ''],
    ['PO-TEST-1', 'STYLE-B', 'ILPTST00000002', 'Paper card', 24000, 24, 1000, 9.5, 10, 41, 24, 22, 228, 24, 1, 14, 228, 120],
    ['', '', '', '', 174500, 625, '', '', '', '', '', '', 2932.5]];
  const pl = packingListLines(plRows);
  eq('packing list: 3 item rows, totals row skipped', pl.lines.map((l) => [l.code, l.qty, l.ppc, l.nw, l.gw, l.l, l.w, l.h, l.po, l.ref, l.pallet]), [
    ['ILPTST00000001', 150000, 250, 4.5, 5, 40, 24, 21, 'PO-TEST-1', 'STYLE-A', '1-12'],
    ['ILPTST00000002', 500, 500, 4.5, 5, 41, 24, 22, 'PO-TEST-1', 'STYLE-B', ''],
    ['ILPTST00000002', 24000, 1000, 9.5, 10, 41, 24, 22, 'PO-TEST-1', 'STYLE-B', '14']]);
  eq('packing list: no warnings when cartons match', pl.warnings, []);
  eq('packing list: title rows above the header are ignored', packingListLines([['IDEA L PACK B.V'], ['PACKING LIST'], plHead, plRows[3]]).lines.map((l) => [l.po, l.ref, l.code]), [['PO-TEST-1', 'STYLE-A', 'ILPTST00000001']]);
  const twoRow = packingListLines([['Internal', 'Order', 'Number', 'Qty'], ['code', 'qty', 'of UOM', '/UOM'], ['ILPTST00000003', 1000, 4, 250]]);
  eq('packing list: header split over two rows', twoRow.lines.map((l) => [l.code, l.qty, l.ppc]), [['ILPTST00000003', 1000, 250]]);
  eq('packing list: carton count mismatch is reported', packingListLines([plHead, ['P', 'S', 'ILPTST00000004', 'x', 1000, 5, 250]]).warnings.length, 1);
  eq('pallet of carton 51 with 50 per pallet on pallets 1-12', [cartonPallet({ pallet: '1-12', perPallet: 50 }, 1), cartonPallet({ pallet: '1-12', perPallet: 50 }, 51), cartonPallet({ pallet: '1-12', perPallet: 50 }, 600), cartonPallet({ pallet: '14' }, 3)], ['1', '2', '12', '14']);
  const stockIn = packingListLines([['Stock -in'], [], ['Entities', 'Customer Item No', 'Idea Item No', 'Product Name', 'Unit Code', 'Location', 'Pcs/carton', 'Lenght (cm)', 'Width (cm)', 'Height (cm)', 'net weight', 'gross weight', 'CBM', 'stock in date', 'PO number/ WO number', 'Suplier code', 'Suplier name', 'Quantity receive', 'sticker'],
    ['Entity A', 'CUST-1', 'ILPTST00000005', 'Shopping bag', 'pcs', 'a01', 400, 56, 37, 22, 8.7, 9.3, 0.0456, 46327, 123456, 'SUP01', 'Supplier One', 1200, ''],
    ['Entity B', 'CUST-2', 'ILPTST00000006', 'Printed label', 'pcs', 'A02', 1000, 32, 25, 17, 9.82, 10.65, 0.0136, 46327, '', 'SUP01', 'Supplier One', '', '']]);
  eq('stock-in sheet (warehouse template) is read', stockIn.lines.map((l) => [l.code, l.ref, l.desc, l.qty, l.ppc, l.l, l.location, l.entity, l.po, l.unit]), [
    ['ILPTST00000005', 'CUST-1', 'Shopping bag', 1200, 400, 56, 'A01', 'Entity A', '123456', 'piece'],
    ['ILPTST00000006', 'CUST-2', 'Printed label', 1000, 1000, 32, 'A02', 'Entity B', '', 'piece']]);
  eq('stock-in sheet: supplier and date picked up, empty quantity flagged', [stockIn.supplier, stockIn.date, stockIn.warnings.length], ['Supplier One', '2026-11-01', 1]);
  eq('excel dates', [excelDate(46327), excelDate('01/11/2026'), excelDate('2026-11-01')], ['2026-11-01', '2026-11-01', '2026-11-01']);
  const delivery = packingListLines([['Packing List No.', 'X'], ['Your Ref.', 'Our Ref.', 'Description', 'Total\nquantity', 'Quantity/\nUOM', 'Number of UOM', 'Net weight kg', 'Gross weight kg', 'L ', 'W', 'H', 'CBM', 'QTY', 'QTY UOM', 'Gross', 'Net'],
    ['CUSTREF-1', 'ILPTST00000007', 'Printed box', 31500, 250, 126, 4.5, 5, 40, 25, 14, 1.764, 31500, 126, 567, 630], ['TOTAL', '', '', 31500, '', 126]]);
  eq('customer delivery packing list (Your Ref / Our Ref) is read', delivery.lines.map((l) => [l.code, l.ref, l.qty, l.ppc, l.nw, l.gw, l.l, l.w, l.h]), [['ILPTST00000007', 'CUSTREF-1', 31500, 250, 4.5, 5, 40, 25, 14]]);
  const pick = pickFromLines(delivery.lines);
  eq('pick list from the delivery packing list', pick.map((p) => [p.code, p.qty, p.cartons, p.ppc]), [['ILPTST00000007', 31500, 126, 250]]);
  const sc = (n, code = 'ILPTST00000007', qty = 250) => [...Array(n)].map((_, i) => ({ cid: `X-1-${i + 1}-${code}`, code, qty }));
  const pp1 = pickProgress({ pick, scans: sc(125) });
  eq('pick: 125 of 126 cartons is short', [pp1.rows[0].status, pp1.gotCartons, pp1.cartons, pp1.complete], ['part', 125, 126, false]);
  eq('pick: all 126 scanned is complete', pickProgress({ pick, scans: sc(126) }).complete, true);
  eq('pick: one carton too many', pickProgress({ pick, scans: sc(127) }).rows[0].status, 'over');
  eq('pick: an item not on the list is flagged', pickProgress({ pick, scans: [...sc(126), ...sc(1, 'ILPTST00000099', 10)] }).extra.map((e) => e.code), ['ILPTST00000099']);
  const inb = { id: 'INB00001', type: 'inbound', docNo: 'SUP-PL-1', date: '2026-10-23', status: 'active', supplier: 'Test supplier', toWh: 'PACK', extRef: 'PO-TEST-1', noteNo: 'pnk0000001', lines: pl.lines, scans: [] };
  const ic = recordCartons(inb);
  eq('supplier receipt: one label per carton, numbered across the list', [ic.length, `${ic[0].n}/${ic[0].of}`, `${ic[624].n}/${ic[624].of}`, ic[624].pallet], [625, '1/625', '625/625', '14']);
  eq('supplier receipt totals', (({ qty, cartons, gw }) => ({ qty, cartons, gw }))(totals(inb)), { qty: 174500, cartons: 625, gw: 3245 });
  eq('supplier receipt waits for the warehouse', [hasReceipt(inb), receiptState(inb).status], [true, 'pending']);
  eq('supplier receipt → In-out detail (Pack) row', movementBlocks(inb, DEFAULT_SETTINGS)[0].rows[0], ['SUP-PL-1', 'STYLE-A', 'ILPTST00000001', 150000, 600, 'in', '2026-10-23', 'Test supplier', 'pnk0000001']);
  eq('supplier receipt needs a supplier', validate({ ...inb, supplier: '' }).length, 1);
  eq('valid supplier receipt passes', validate(inb), []);

  // Storage: put away on shelves, stock by location (France report layout)
  const recv = { id: 'RCV00001', type: 'inbound', docNo: 'R1', date: '2026-11-01', createdAt: 1, status: 'active', supplier: 'S', toWh: 'FR', scans: [],
    lines: [{ ln: 1, code: 'ILPTST00000010', ref: 'REF-10', qty: 1000, ppc: 250, location: 'a. 1. 2' }, { ln: 2, code: 'ILPTST00000011', ref: 'REF-11', qty: 300, ppc: 100 }] };
  const ids10 = recordCartons(recv).filter((c) => c.code === 'ILPTST00000010').map((c) => c.id);
  const ids11 = recordCartons(recv).filter((c) => c.code === 'ILPTST00000011').map((c) => c.id);
  const put = { id: 'PUT00001', type: 'putaway', docNo: 'PA1', date: '2026-11-02', createdAt: 2, status: 'active', toWh: 'FR', loc: 'B.3.1', scans: ids11.slice(0, 2).map((cid) => ({ cid, code: 'ILPTST00000011', qty: 100 })) };
  const shipOut = { id: 'SHP00001', type: 'shipment', docNo: 'S1', date: '2026-11-03', createdAt: 3, status: 'active', fromWh: 'FR', lines: [], scans: [{ cid: ids10[0], code: 'ILPTST00000010', qty: 250 }] };
  const st = stockByLocation(currentStock([shipOut, put, recv]), 'FR');
  eq('stock by location after put away and a shipment', st.map((r) => [r.loc, r.ref, r.cartons, r.perCarton]), [['A.1.2', 'REF-10', 3, 250], ['B.3.1', 'REF-11', 2, 100], ['', 'REF-11', 1, 100]]);
  eq('voided put away is ignored', stockByLocation(currentStock([recv, { ...put, status: 'void' }]), 'FR').map((r) => [r.loc, r.cartons]), [['A.1.2', 4], ['', 3]]);
  eq('location helpers', [rackOf('A.1.2'), rackOf('A01'), locLabel('a.1.2'), locLabel('A01')], ['A', 'A', 'A. 1. 2', 'A01']);
  eq('shelf label QR parses', parseScan(locationPayload('A.1.2')), { location: 'A.1.2' });
  eq('put away needs a location and cartons', validate({ ...put, loc: '', scans: [] }).length, 2);
  eq('valid put away passes', validate(put), []);

  // One standard export for every warehouse (Ms Ly's "Stock data" sheet), one row per carton
  const recvX = { ...recv, lines: [{ ...recv.lines[0], entity: 'Entity A', supplierCode: 'SUP01', supplierName: 'Supplier One', po: 'PO-9', l: 40, w: 25, h: 14, nw: 4.5, gw: 5 }, recv.lines[1]] };
  const led = cartonLedger([put, recvX, { ...shipOut, customer: 'Customer X', docNo: 'INV-1' }]);
  const sd = stockDataRows(led, { wh: 'FR' });
  eq('stock data has her 21 columns', STOCK_DATA_HEADER.length, 21);
  eq('stock data: one row per carton (incl. shipped)', sd.length, 7);
  const shippedRow = sd.find((r) => r[4] === ids10[0]);
  eq('stock data row for a shipped carton', [shippedRow[0], shippedRow[2], shippedRow[6], shippedRow[7], shippedRow[13], shippedRow[15], shippedRow[16], shippedRow[17], shippedRow[19], shippedRow[20]],
    ['Entity A', 'ILPTST00000010', 'A. 1. 2', 250, 0.014, 'PO-9', 'SUP01', 'Supplier One', 'INV-1', 'Customer X']);
  eq('stock data in stock only', stockDataRows(led, { wh: 'FR', inStockOnly: true }).length, 6);

  // Reading supplier PDFs (text pieces as pdf.js gives them; made-up documents shaped like real VN delivery notes)
  eq('document numbers', [docNum('1.000'), docNum('2,700.00'), docNum('4.5'), docNum('12'), docNum('Hộp')], [1000, 2700, 4.5, 12, 'Hộp']);
  eq('carton size in mm becomes cm', [parseDims('600*400*360'), parseDims('40 x 24 x 21')], [{ l: 60, w: 40, h: 36 }, { l: 40, w: 24, h: 21 }]);
  eq('PO found on the document', [docPO('PO: POVNP-2600011'), docPO('Số PO khách hàng: POVNP-2600012'), docPO('nothing here')], ['POVNP-2600011', 'POVNP-2600012', '']);
  const T = (s, x, y, w) => ({ s, x, y, w, h: 9, page: 1 });
  const pxk = linesToTable(textToLines([
    T('PHIẾU XUẤT KHO', 200, 700, 150), T('Bên mua hàng: Công ty Test', 20, 660, 200),
    T('STT', 20, 560, 20), T('Tên, nhãn hiệu, quy cách', 60, 560, 180), T('Quy Cách', 300, 560, 60), T('ĐVT', 420, 560, 25), T('Số lượng', 480, 560, 60),
    T('phẩm chất vật tư', 80, 548, 120), T('Kế hoạch', 460, 548, 45), T('Thực xuất', 520, 548, 50),
    T('PO: POVNP-2600001', 60, 530, 120),
    T('1', 25, 515, 5), T('ILPTEST0000001', 60, 515, 90), T('600*400*360', 300, 515, 70), T('Hộp', 420, 515, 20), T('1.000', 530, 515, 30),
    T('TỔNG', 60, 500, 40), T('1.000', 530, 500, 30)]));
  const pxkLines = packingListLines(pxk.rows).lines;
  eq('supplier delivery note (Phiếu xuất kho) is read from PDF text', pxkLines.map((l) => [l.code, l.qty, l.unit, l.l, l.w, l.h]), [['ILPTEST0000001', 1000, 'box', 60, 40, 36]]);
  eq('PO read from the delivery note text', docPO(pxk.text), 'POVNP-2600001');
  const bb = linesToTable(textToLines([
    T('BIÊN BẢN GIAO HÀNG', 200, 700, 200),
    T('STT', 20, 560, 20), T('Mã vật tư', 60, 560, 70), T('Tên vật tư', 180, 560, 70), T('ĐVT', 300, 560, 25), T('Số lượng', 350, 560, 50), T('Đơn giá', 420, 560, 50),
    T('1', 25, 540, 5), T('ILPTEST0000002', 60, 540, 100), T('Kéo cắt', 180, 540, 60), T('Cái', 300, 540, 20), T('2', 370, 540, 5), T('0', 440, 540, 5),
    T('2', 25, 525, 5), T('ILPTEST0000003', 60, 525, 100), T('Keo 502', 180, 525, 60), T('Lọ', 300, 525, 20), T('100', 365, 525, 18), T('0', 440, 525, 5),
    T('3', 25, 510, 5), T('ILPTEST0000004', 60, 510, 100), T('Màng PE', 180, 510, 60), T('Cuộn', 300, 510, 25), T('5', 370, 510, 5), T('0', 440, 510, 5)]));
